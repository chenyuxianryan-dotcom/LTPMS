server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: ltpms-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1

ltpms:
  jwt:
    secret: ${JWT_SECRET:please-change-me-in-production}
    expiration: ${JWT_EXPIRATION:7200000}
  upload:
    # 头像上传存储目录（相对后端工作目录）
    avatar-dir: ${UPLOAD_AVATAR_DIR:./uploads/avatar}
    # 课题数据集私有存储目录（不进静态放行，下载一律鉴权接口）
    lab-file-dir: ${UPLOAD_LAB_FILE_DIR:./uploads/lab}
    # 课题数据集单文件大小上限（MB，配置项）
    lab-max-file-size-mb: ${UPLOAD_LAB_MAX_FILE_MB:50}
    # 知识库文档私有存储目录（不进静态放行，下载一律鉴权接口）
    kb-file-dir: ${UPLOAD_KB_FILE_DIR:./uploads/kb}
    # 知识库单文件大小上限（MB）
    kb-max-file-size-mb: ${UPLOAD_KB_MAX_FILE_MB:20}
  nlq:
    service-url: ${NLQ_SERVICE_URL:http://localhost:8001}
    internal-token: ${NLQ_INTERNAL_TOKEN:}
    rate-limit-per-minute: 10

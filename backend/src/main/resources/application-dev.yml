spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:ltpms_db}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:ltpms}
    password: ${DB_PASSWORD:ltpms}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  web:
    cors:
      allowed-origins: http://localhost:5173, http://localhost:8000, http://10.130.126.206:8000

logging:
  level:
    com.ltpms: debug
    org.springframework.security: debug
